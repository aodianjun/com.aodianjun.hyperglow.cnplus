name: Verify HyperGlow

on:
  push:
    branches:
      - main
      - "trae/agent-**"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

# 正式签名 secrets（未配置时 release job 跳过签名，仅做 R8 压缩）
env:
  SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
  SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # trace=default: 诊断日志开关可控(默认关闭,仅 w/e 级错误日志)
        # trace=false:    编译时硬关闭 trace,即使误开诊断日志开关也不输出 i 级日志
        include:
          - variant: default
            trace-arg: ""
            apk-suffix: ""
          - variant: notrace
            trace-arg: "-PtraceLogging=false"
            apk-suffix: "-notrace"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test and build debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain ${{ matrix.trace-arg }}

      - name: Rename APK with variant suffix
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          DST="app/build/outputs/apk/debug/app-debug${{ matrix.apk-suffix }}.apk"
          # default 变体 suffix 为空时 SRC == DST,mv 同名文件会失败,跳过即可
          if [ "$SRC" != "$DST" ]; then
            mv "$SRC" "$DST"
          fi
          echo "APK_PATH=$DST" >> "$GITHUB_ENV"

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v6
        with:
          name: hyperglow-debug-${{ matrix.variant }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish debug APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="debug-${GITHUB_SHA::7}"
          # 从本次 commit 生成 release 简介(标题行 + 正文,若为空则给占位说明)
          COMMIT_MSG=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
            --jq '.commit.message' 2>/dev/null || true)
          NOTES="Automated debug build from commit \`${GITHUB_SHA}\`.
          ## 本次变更
          \`\`\`
          ${COMMIT_MSG:-（无 commit message，仅触发构建）}
          \`\`\`
          ## 包含两个变体
          - app-debug.apk: 诊断日志开关可控(默认仅 w/e 级错误日志)
          - app-debug-notrace.apk: 编译时硬关闭 trace(即使开诊断日志开关也不输出 i 级日志)
          This is an unverified debug build for testing. Not for production use.
          详见 commit 历史: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}"
          # 若 release 已存在(default job 先创建),则追加 asset;否则创建新 release
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "HyperGlow debug ${GITHUB_SHA::7}" \
              --notes "$NOTES" \
              --prerelease
          fi

  # 发布用 release 变体: R8 压缩体积更小。若配置了 SIGNING_* secrets 则正式签名,
  # 否则构建未签名 APK(需自行补签)。产物上传到正式 Release(如 v0.3.65)。
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore (if configured)
        if: env.SIGNING_KEYSTORE_B64 != ''
        run: |
          mkdir -p app/keystore
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > app/keystore/release.jks
          echo "SIGNING_KEYSTORE_FILE=$GITHUB_WORKSPACE/app/keystore/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Locate release APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Found release APK: $APK"

      - name: Upload release APK (artifact)
        uses: actions/upload-artifact@v6
        with:
          name: hyperglow-release
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish release APK to release tag
        # 上传到正式发布 tag。默认取当前版本号对应的 tag(如 v0.3.65),
        # 或用显式输入的 RELEASE_TAG 覆盖。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG:-}" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="v$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          fi
          echo "Publishing to release: $TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || {
            echo "::error::Release tag $TAG not found"
            exit 1
          }
          gh release upload "$TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" --clobber
