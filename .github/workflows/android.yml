name: Verify HyperGlow

on:
  push:
    branches:
      - main
      - "trae/agent-**"
      - "fix/aod-clock-follow"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

# 正式签名 secrets（未配置时 release job 跳过签名，仅做 R8 压缩）
env:
  SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
  SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # trace=default: 诊断日志开关可控(默认关闭,仅 w/e 级错误日志)
        # trace=false:    编译时硬关闭 trace,即使误开诊断日志开关也不输出 i 级日志
        include:
          - variant: default
            trace-arg: ""
            apk-suffix: ""
          - variant: notrace
            trace-arg: "-PtraceLogging=false"
            apk-suffix: "-notrace"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        # Runner 镜像(20260907+)预装的 sdkmanager 版本与 android-actions/setup-android@v4
        # 期望不符:该 action 会去安装早已从 SDK 仓库移除的 "tools" 包并以 exit 1 失败。
        # Runner 本身已预装完整 SDK(ANDROID_HOME / ANDROID_SDK_ROOT 已指向它),
        # 因此改为只接受许可、失败不阻塞构建;未预装 SDK 的环境仍可自备。
        run: |
          set -uo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -1 "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 发布契约校验(issue #68 #7):applicationId/版本格式/tag 约定/资产命名模板/
      # 必含文档;结构违规即红。版本新鲜度不在 CI 阻塞(发版 bump 提交同步维护即可)。
      - name: Validate release contract
        run: pwsh ./scripts/validate-release-contract.ps1 -RepoRoot .

      # 防止无意重命名/重排 HyperLyric 插件契约副本(plugins/api/.../PluginApi.kt)。
      # 该文件必须与上游契约字节级一致,否则预编译插件 ZIP 无法无需重编译加载。
      - name: Verify HyperLyric plugin API contract fingerprint
        run: python3 plugins/api/check-api-fingerprint.py

      - name: Test and build debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain ${{ matrix.trace-arg }}

      - name: Rename APK with variant suffix
        run: |
          set -euo pipefail
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          SRC=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          DST="app/build/outputs/apk/debug/hyperglow-cnplus-debug${{ matrix.apk-suffix }}-v${VN}-${VC}.apk"
          # default 变体 suffix 为空时 SRC != DST(文件名不同),始终需重命名
          mv "$SRC" "$DST"
          echo "APK_PATH=$DST" >> "$GITHUB_ENV"

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v6
        with:
          name: hyperglow-debug-${{ matrix.variant }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

  # 汇总两个 debug 变体并发布为预发行 release。必须独立 job:矩阵两个变体并行,
  # 若各自 delete+create+upload 会互相覆盖(后删的删掉先传的 APK),导致缺一个变体。
  publish-debug:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download debug APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: hyperglow-debug-*
          merge-multiple: true

      - name: Publish debug APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 稳定的 debug release:每次构建都删除旧 release 再重建,确保发布时间刷新
          TAG="debug"
          # 从本次 commit 生成 release 简介(标题行 + 正文,若为空则给占位说明)
          COMMIT_MSG=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
            --jq '.commit.message' 2>/dev/null || true)
          NOTES="> ⚠️ **测试版本请勿下载** — 此调试包仅供测试与问题排查，请勿用于日常使用。

          Automated debug build from commit \`${GITHUB_SHA}\`.
          ## 本次变更
          \`\`\`
          ${COMMIT_MSG:-（无 commit message，仅触发构建）}
          \`\`\`
          ## 包含两个变体
          - hyperglow-cnplus-debug-v{版本号}.apk: 诊断日志开关可控(默认仅 w/e 级错误日志)
          - hyperglow-cnplus-debug-notrace-v{版本号}.apk: 编译时硬关闭 trace(即使开诊断日志开关也不输出 i 级日志)
          This is an unverified debug build for testing. Not for production use.
          详见 commit 历史: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}"
          # 预发行 debug:每次构建都删除旧 release 再重建,确保发布时间刷新(而非 --clobber 覆盖)。
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "HyperGlow Debug (latest)" \
            --notes "$NOTES" \
            --prerelease || true
          # 串行上传全部已下载的 APK(两个变体),避免并行覆盖
          find apks -maxdepth 1 -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            echo "Uploading $(basename "$apk")"
            gh release upload "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --clobber || true
          done
          echo "Debug release assets:" && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name'

  # 发布用 release 变体: R8 压缩体积更小。若配置了 SIGNING_* secrets 则正式签名,
  # 否则构建未签名 APK(需自行补签)。产物上传到正式 Release(如 v0.3.65)。
  # 签名密钥放在受保护的 release 环境(Actions secrets),支持审批/分支保护。
  # 插件 ZIP 的滚动预发行:与 debug 发布同一思路——单条 release、每次构建删旧建新,
  # 资产始终对应最新 main。PR 上只做打包校验并上传 artifact,不发布(避免把未合并的代码发出去)。
  publish-plugins:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        # 与 build job 同款:runner 已预装完整 SDK(ANDROID_HOME 已指向它),这里只接受许可。
        run: |
          set -uo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -1 "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 插件 ZIP = manifest.json + classes.dex(d8 取自 SDK build-tools)。
      # 这一步在 PR 上也会执行:它是插件打包管线唯一的自动化验证(主 CI 只构建 :app)。
      # amll-ttml 与 ai-translation 的单元测试一并在此运行(PLUGIN_RELEASE_CONVENTIONS §7:单测是发布前必过门禁)。
      - name: Build plugin ZIPs
        run: ./gradlew :plugins:lyricfetch:pluginZip :plugins:scriptconvert:pluginZip :plugins:amll-ttml:test :plugins:amll-ttml:pluginZip :plugins:ai-translation:test :plugins:ai-translation:pluginZip --console=plain

      - name: Upload plugin ZIPs (artifact)
        uses: actions/upload-artifact@v6
        with:
          name: hyperglow-plugins
          path: plugins/*/build/distributions/hyperglow-*-plugin.zip
          if-no-files-found: error

      - name: Publish plugin ZIPs to rolling pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 稳定的 plugins release:每次 main 构建删除旧 release 再重建(与 debug 发布同思路)。
          TAG="plugins"
          LF_VER=$(grep -oP '"version":\s*"\K[^"]+' plugins/lyricfetch/src/main/plugin/manifest.json || echo "?")
          SC_VER=$(grep -oP '"version":\s*"\K[^"]+' plugins/scriptconvert/src/main/plugin/manifest.json || echo "?")
          AT_VER=$(grep -oP '"version":\s*"\K[^"]+' plugins/amll-ttml/src/main/plugin/manifest.json || echo "?")
          AI_VER=$(grep -oP '"version":\s*"\K[^"]+' plugins/ai-translation/src/main/plugin/manifest.json || echo "?")
          NOTES="> ⚠️ **插件随 main 滚动更新** — 每次构建都会删除重建本 release，资产始终对应最新提交。

          HyperLyric / HyperGlow 兼容插件（安装：HyperGlow 设置 → 插件管理 → 从本地 ZIP 安装，装好后在插件管理页开启）：

          - **hyperglow-lyricfetch-plugin.zip** — 在线歌词增强：媒体信息 → 在线取词（网易云逐字 / QQ / LRCLIB）→ 多格式解析 → 替换歌词；含宿主持久缓存管理（缓存页可列出/删除条目）。
          - **hyperglow-scriptconvert-plugin.zip** — 歌词字形转换：简 ⇄ 繁（OpenCC 词典）。
          - **hyperglow-amll-ttml-plugin.zip** — AMLL TTML 逐字歌词：从 AMLL TTML DataBase 取词（逐字/翻译/音译/和声/对唱，API 地址可配）；含宿主持久缓存管理。
          - **hyperglow-ai-translation-plugin.zip** — AI 歌词翻译：用任意 OpenAI 兼容接口（地址/模型/Key 可配）翻译歌词，按曲目缓存；含宿主缓存管理。

          ## 致谢
          - [accompanist-lyrics-core](https://github.com/6xingyv/accompanist-lyrics-core)（Apache-2.0，作者 6xingyv）— 多格式歌词解析内核，随 lyricfetch 打进 dex。
          - [Lyricify-Lyrics-Helper](https://github.com/WXRIW/Lyricify-Lyrics-Helper)（Apache-2.0，作者 WXRIW）— 在线取词语义、匹配打分与音节合并按其行为移植（C# → Kotlin）。
          - [OpenCC](https://github.com/BYVoid/OpenCC)（Apache-2.0，作者 BYVoid）— scriptconvert 的简繁转换词典数据。
          - [AMLL TTML DataBase](https://github.com/amll-dev/amll-ttml-db) / [amll-ttml-api](https://github.com/amll-dev/amll-ttml-api)（MIT / Apache-2.0 双许可，amll-dev）— amll-ttml 的歌词数据与 API 服务；歌词数据版权归各平台与权利人所有。
          - 在线来源：网易云音乐 / QQ 音乐 / LRCLIB（公开接口）；歌词数据版权归各平台与权利人所有。

          插件版本：lyricfetch ${LF_VER} / scriptconvert ${SC_VER} / amll-ttml ${AT_VER} / ai-translation ${AI_VER}
          构建自 commit \`${GITHUB_SHA}\`，源码见 plugins/lyricfetch、plugins/scriptconvert、plugins/amll-ttml 与 plugins/ai-translation。

          ⚠️ 插件不在主程序 APK 内，与主程序版本无关；插件默认关闭。"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "HyperGlow Plugins (latest)" \
            --notes "$NOTES" \
            --prerelease || true
          find plugins -name 'hyperglow-*-plugin.zip' -print0 | while IFS= read -r -d '' zip; do
            echo "Uploading $(basename "$zip")"
            gh release upload "$TAG" "$zip" --repo "$GITHUB_REPOSITORY" --clobber || true
          done
          echo "Plugin release assets:" && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name'

  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        # Runner 镜像(20260907+)预装的 sdkmanager 版本与 android-actions/setup-android@v4
        # 期望不符:该 action 会去安装早已从 SDK 仓库移除的 "tools" 包并以 exit 1 失败。
        # Runner 本身已预装完整 SDK(ANDROID_HOME / ANDROID_SDK_ROOT 已指向它),
        # 因此改为只接受许可、失败不阻塞构建;未预装 SDK 的环境仍可自备。
        run: |
          set -uo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -1 "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore (if configured)
        if: env.SIGNING_KEYSTORE_B64 != ''
        run: |
          mkdir -p app/keystore
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > app/keystore/release.jks
          echo "SIGNING_KEYSTORE_FILE=$GITHUB_WORKSPACE/app/keystore/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK (signed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Build debug APK
        # 每个正式版本同时发布一个调试版供提 issue 时使用(调试签名,已入库 keystore)
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Locate and rename APKs
        run: |
          set -euo pipefail
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          REL=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          if [ -z "$REL" ]; then
            REL=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          fi
          REL_DST="app/build/outputs/apk/release/hyperglow-cnplus-release-v${VN}-${VC}.apk"
          mv "$REL" "$REL_DST"
          DBG=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          DBG_DST="app/build/outputs/apk/debug/hyperglow-cnplus-debug-v${VN}-${VC}.apk"
          mv "$DBG" "$DBG_DST"
          echo "RELEASE_APK=$REL_DST" >> "$GITHUB_ENV"
          echo "DEBUG_APK=$DBG_DST" >> "$GITHUB_ENV"
          echo "Release APK: $REL_DST"
          echo "Debug APK: $DBG_DST"

      # 发布 APK 禁止字符串扫描(issue #68 #7/#9):正式包绝不允许出现调试签名标记等
      # 违禁串;命中即失败,拦截"伪正式版"流出。
      - name: Scan release APK for forbidden strings
        run: pwsh ./scripts/validate-release-contract.ps1 -RepoRoot . -ApkPath "${{ env.RELEASE_APK }}"

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v6
        with:
          name: hyperglow-version
          path: |
            ${{ env.RELEASE_APK }}
            ${{ env.DEBUG_APK }}
          if-no-files-found: error

      - name: Publish APKs and update release notes
        # 上传到正式发布 tag(默认取版本号,如 v0.3.65;可用 RELEASE_TAG 覆盖),
        # 并在 release 说明中写明正式版与调试版各自的用途。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG:-}" ]; then
            TAG="$RELEASE_TAG"
          else
            # 默认 tag 用 VersionCode-VersionName 格式(如 85-0.3.68),
            # 符合 LSPosed 模块仓库对 release tag 的规范要求。
            VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
            VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
            TAG="${VC}-${VN}"
          fi
          echo "Publishing to release: $TAG"
          # 版本 release 的发布契约(docs/RELEASE_CONVENTIONS.md):
          # - 不存在 → 失败:绝不静默建成正式版(正式版必须由维护者显式预创建)
          # - 已发布为正式版(非预发行) → 跳过:正式版资产一经发布即冻结,
          #   后续 main 推送不得 --clobber 覆盖(该版本内容由发版提交固定)。
          #   不失败,是因为 main 上的文档/CI 推送不该把整条流水线判红。
          # - 预发行 → 正常灌入 APK
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG does not exist. Pre-create the prerelease (tag $TAG, prerelease: true) before publishing - see docs/RELEASE_CONVENTIONS.md."
            exit 1
          fi
          IS_PRERELEASE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease --jq '.isPrerelease')
          if [ "$IS_PRERELEASE" != "true" ]; then
            echo "::notice::release $TAG is already published as a stable release; skipping asset publish to keep it immutable. Bump the version to publish a new release."
            exit 0
          fi
          gh release upload "$TAG" "$RELEASE_APK" "$DEBUG_APK" \
            --repo "$GITHUB_REPOSITORY" --clobber
          # 预发行(Pre-release)版本在说明开头加醒目提示,避免用户误装测试包
          IS_PRERELEASE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo false)
          echo "isPrerelease=$IS_PRERELEASE"
          # 生成两个版本用途说明;写入前先剔除正文中旧的安装说明块,避免重复堆积
          cat > release-notes-extra.md <<EOF
          $(if [ "$IS_PRERELEASE" = "true" ]; then
            echo "> ⚠️ **测试版本请勿下载** — 此版本为预发行测试版，仅供测试与问题排查，请勿用于日常使用。"
            echo
          fi)
          ## 安装包用途说明
          - **\`__REL__\`（正式版）**：正常使用请安装此版本。正式签名、R8 压缩，适合日常安装使用。
          - **\`__DBG__\`（调试版）**：提 issue 反馈问题时请安装此版本，可提供详细诊断日志辅助排查。调试签名，仅用于测试与问题排查，请勿作为日常版本长期安装。
          EOF
          sed -i "s|__REL__|$(basename "$RELEASE_APK")|g; s|__DBG__|$(basename "$DEBUG_APK")|g" release-notes-extra.md
          EXISTING=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body' 2>/dev/null || true)
          # 移除已有正文中旧的"## 安装包用途说明"块(从该标题到其后第一个 --- 分隔线)
          # 以及旧的预发行警告行(每次 CI 都会在块前重新插入,不清理会逐次堆积)
          CLEANED=$(printf '%s' "$EXISTING" | sed '/^## 安装包用途说明/,/^---/d; /^> ⚠️ \*\*测试版本请勿下载\*\*/d')
          # 仅当清理后仍有正文时,才放在新安装说明之后;否则只保留安装说明
          if printf '%s' "$CLEANED" | sed '/^[[:space:]]*$/d' | grep -q .; then
            { cat release-notes-extra.md; echo; echo "---"; echo "$CLEANED"; } > release-notes-final.md
          else
            cat release-notes-extra.md > release-notes-final.md
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes-final.md
